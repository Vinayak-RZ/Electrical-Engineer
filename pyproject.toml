[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "electrical-engineer"
version = "0.1.0"
description = "UG electrical engineering co-solver"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[project.scripts]
electrical-engineer = "electrical_engineer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/electrical_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
